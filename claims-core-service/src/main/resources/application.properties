spring.application.name=claims-core-service
server.port=8081

# H2 baseline so the module runs without external infra.
spring.datasource.url=jdbc:h2:mem:claims;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate dialect auto-detected by Boot 3 / Hibernate 6
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

