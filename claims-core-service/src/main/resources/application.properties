spring.application.name=claims-core-service
server.port=8081

# H2 baseline so the module runs without external infra.
spring.datasource.url=jdbc:h2:mem:claims;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# LANDMINE [Hibernate]: explicit Hibernate 5 dialect class. The dialect package and
# the org.hibernate.dialect.H2Dialect resolution behaviour change in Hibernate 6.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# LANDMINE [Jasypt]: ENC() value encrypted with the PBEWithMD5AndDES setup above.
# Re-encrypting under a Boot-3-compatible jasypt 3.x + stronger algorithm is part of the fix.
external.partner.api.key=ENC(bpMZO+Uj8cQIypmztvjrB5yEGofKPePYx0SSCmc7iPU=)
